services:
  - type: web
    name: echobot
    env: docker
    plan: free
    branch: main
    envVars:
      - key: PORT
        value: 8000
      - key: GOOGLE_API_KEY
        sync: false # User must provide this in Render Dashboard
      - key: SESSION_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /api/health
